# Application Configuration for Integration Tests
# Activo: @ActiveProfiles("test")

# Server
server.port=0
server.servlet.context-path=/api

# ==================== DATABASE (H2 IN-MEMORY) ====================
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (para debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.generate_statistics=false

# ==================== MONGODB (EMBEBIDO/TEST) ====================
spring.data.mongodb.uri=mongodb://localhost:27017/bank_test_db
spring.data.mongodb.auto-index-creation=true

# ==================== SECURITY ====================
jwt.secret=test-secret-key-min-32-characters-length-for-security-test-1234567890
jwt.expiration=86400000

# ==================== LOGGING ====================
logging.level.root=INFO
logging.level.app=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.test=INFO

# ==================== JACKSON ====================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# ==================== TEST CONFIGURATION ====================
spring.test.database.replace=any
